
  deploy-test:
    name: Deploy to TEST
    needs: build
    runs-on: ubuntu-latest

    # Connect GitHub TEST environment
    environment:
      name: TEST

    # Run only when TEST branch is pushed
    if: github.ref == 'refs/heads/TEST'

    steps:

      # Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: ./deploy

      # Check TEST environment secrets
      - name: Verify TEST Secrets
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_TEST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_TEST }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_TEST }}

        run: |
          set -e

          if [ -z "$TOMCAT_URL" ]; then
            echo "ERROR: TOMCAT_URL_TEST is missing"
            exit 1
          fi

          if [ -z "$TOMCAT_USER" ]; then
            echo "ERROR: TOMCAT_USER_TEST is missing"
            exit 1
          fi

          if [ -z "$TOMCAT_PASS" ]; then
            echo "ERROR: TOMCAT_PASS_TEST is missing"
            exit 1
          fi

          echo "All TEST secrets loaded successfully"

      # Deploy WAR to TEST Tomcat
      - name: Deploy WAR to TEST Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_TEST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_TEST }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_TEST }}

        run: |
          set -e

          WAR_FILE=$(find ./deploy -maxdepth 1 -name "*.war" -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          URL="${TOMCAT_URL%/}"

          echo "Deploying $WAR_FILE to TEST"

          curl --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$URL/deploy?path=/train-ticket-reservation&update=true"

          echo "TEST deployment completed successfully"

